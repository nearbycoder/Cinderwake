name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run regression tests
        run: cargo test --locked

  web:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Lint the browser build
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Compile and link the browser build
        run: cargo build --locked --target wasm32-unknown-unknown
