[package]
name = "cinderwake"
version = "0.1.0"
edition = "2021"
description = "An original clockwork action roguelite and Rust game framework"
license = "MIT"

[dependencies]
macroquad = { version = "0.4.14", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Gamepads on the desktop; the browser build reads the Gamepad API through
# web/cinderwake-pad.js instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Macroquad 0.4.16 with one fix to its glyph atlas, which could grow to
# 8192 × 8192 (about 270 MB of memory and as much again on the GPU) while
# caching the interface's text. See vendor/README.md.
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }
